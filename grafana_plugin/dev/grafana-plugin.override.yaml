# Nakładka na compose.yaml z grafana_automation_js: montuje zbudowany plugin
# i pozwala Grafanie załadować go bez podpisu. Używana przez dev/deploy.sh.
services:
  grafana:
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: mainframe-dasdmap-panel
    volumes:
      - ${MAINFRAME_PLUGIN_DIST}:/var/lib/grafana/plugins/mainframe-dasdmap-panel:ro,z
